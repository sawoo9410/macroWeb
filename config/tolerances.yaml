# fact-checker 수치 대조 허용 오차 (PLAN 부록 F). claim.value/unit ↔ market 테이블.
default_rel: 0.005
by_unit:
  "%": {abs: 0.05, note: 금리·비율 — 소수점 둘째 자리 반올림 차이 허용}
  bp: {abs: 1}
  index: {rel: 0.002, note: 지수 종가}
  KRW: {rel: 0.002, note: 환율}
  USD: {rel: 0.005}
  조원: {rel: 0.01, note: 한국 기사 억/조 반올림}
  억원: {rel: 0.01}
  YoY: {abs: 0.1}
  QoQ: {abs: 0.1}
  MoM: {abs: 0.05}
by_pair:   # 같은 지표·다른 출처 (ADR-0005-3·4). 왼쪽이 우선 출처
  "UST:10Y~FRED:DGS10": {abs: 0.02, note: "둘 다 재무부 par 수익률, 반올림 차이"}
  "UST:2Y~FRED:DGS2": {abs: 0.02}
  "ECB:USD_KRW_CROSS~ECOS:FX_USDKRW": {rel: 0.005, note: "ECB 14:15 CET 고시 교차환율 vs 서울 종가"}
  "NAVER:KOSPI~ECOS:802Y001": {rel: 0.002}
  "NAVER:.VIX~FRED:VIXCLS": {abs: 0.1}
