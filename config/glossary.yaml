# 용어집 — 리포트 괄호 풀이 시드 (PLAN 부록 J). writer-ko 가 첫 등장 시 괄호로 푼다.
terms:
  FOMC: 연방공개시장위원회, 미국 기준금리 결정 회의
  점도표: 위원들의 금리 전망 분포
  매파/비둘기파: 긴축/완화 선호
  연준 독립성: 정치권 압력과 무관한 금리 결정
  장기금리: 10년 국채 수익률, 성장주 밸류에이션의 할인율
  capex: 설비투자
  FCF: 잉여현금흐름
  HBM: 고대역폭메모리, AI GPU 옆 메모리
  CoWoS: TSMC 첨단 패키징
  오픈웨이트: 가중치 공개 모델
  KV캐시: 추론 시 메모리를 차지하는 중간값
  외국인 수급: 외국인 순매수, KOSPI 방향의 큰 손
  한미 금리차: 환헤지 비용의 뿌리
  Brier score: 확률 예측 정확도, 0이 완벽
  혼잡도: 같은 결론을 말하는 출처 비율
  전파: 한 사건이 그래프를 타고 번지는 경로
  RRP: 역레포, 연준에 하루 맡기는 초단기 자금(유동성 흡수)
  TGA: 재무부 일반계정, 정부가 연준에 둔 현금 잔고
