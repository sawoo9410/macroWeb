# 소스 레지스트리 (PLAN §4.2, 부록 B). 소스 1개 = 어댑터 1개 + 픽스처 1개 + 골든 테스트 1개 (Phase 1).
# URL 은 2026-11-01 `macroweb source probe --all` 로 실제 요청해 확인 (결과: docs/SOURCE_PROBE_2026-11-01.md).
# 키가 필요한 API 는 auth_env 로 환경변수 이름만 적고, probe_url 은 키 없이 응답하는 주소를 쓴다. 값은 절대 적지 않는다.
sources:
  # ---------------- T0 1차 출처 ----------------
  - id: fed_press
    name: Federal Reserve press releases
    tier: 0
    kind: rss
    url: https://www.federalreserve.gov/feeds/press_all.xml
    lang: en
    country: US
    topics: [fed, rates, policy]
    parent_org: federal-reserve
    parser: rss_default
    rate_limit_s: 5
    stratum: S-T0-STMT
    select_policy: title_regex
    select_regex: "(FOMC|monetary policy|Federal Open Market|Beige Book|interest rate|discount rate|balance sheet|Chair|Governor|statement|minutes)"
    fetch_body: true
  - id: fed_speeches
    name: Federal Reserve speeches & testimony
    tier: 0
    kind: rss
    url: https://www.federalreserve.gov/feeds/speeches.xml
    lang: en
    country: US
    topics: [fed, rates, persons]
    parent_org: federal-reserve
    parser: rss_default
    rate_limit_s: 5
    stratum: S-T0-LONG
    select_policy: all
    fetch_body: true
  - id: fomc_calendar
    name: FOMC meeting calendar, statements, minutes index
    tier: 0
    kind: html
    url: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
    lang: en
    country: US
    topics: [fed, calendar]
    parent_org: federal-reserve
    parser: fomc_calendar_v1
    rate_limit_s: 5
    stratum: S-T0-STMT
    select_policy: all
    interval_s: 10800   # 정적 페이지(ETag 304) — 3시간; FOMC 당일은 이벤트 모드 10분
    fetch_body: true
  - id: fred_api
    name: FRED API (DFF, DGS2, DGS10, T10Y2Y, CPIAUCSL, PCEPILFE, PAYEMS, UNRATE, DTWEXBGS, WALCL, RRPONTSYD, WTREGEN, BAMLH0A0HYM2, VIXCLS, DCOILBRENTEU)
    tier: 0
    kind: api
    url: https://api.stlouisfed.org/fred/series/observations
    probe_url: https://api.stlouisfed.org/fred/series/observations?series_id=DGS10&file_type=json
    auth_env: FRED_API_KEY
    notes: "키 없는 fredgraph.csv 경로는 수집기 UA 에 응답하지 않는다(타임아웃) — API 키 입력 후 활성 수집. 그 전엔 어댑터만"
    lang: en
    country: US
    topics: [rates, inflation, liquidity, dollar, data]
    parent_org: st-louis-fed
    parser: fred_v1
    stratum: S-DATA
    params:
      series: [DFF, DGS2, DGS10, T10Y2Y, CPIAUCSL, PCEPILFE, PAYEMS, UNRATE, DTWEXBGS, WALCL, RRPONTSYD, WTREGEN, BAMLH0A0HYM2, VIXCLS, DCOILBRENTEU, SP500, NASDAQCOM, DEXKOUS]
      lookback_days: 800
  - id: bls_release_schedule
    name: BLS news release schedule (CPI/PPI/NFP dates)
    tier: 0
    kind: html
    url: https://www.bls.gov/schedule/news_release/
    lang: en
    country: US
    topics: [calendar, inflation, labor]
    parent_org: bls
    parser: bls_schedule_v1
    rate_limit_s: 10
    stratum: S-DATA
    enabled: false
    notes: "2026-11-01 probe 403 — BLS 가 선언형 수집기 UA 를 차단. 브라우저 UA 위장은 하지 않는다(PLAN §0.1-7). Phase 1 대안: FRED `releases/dates` API(키)로 CPI/PPI/NFP 발표 일정 수집"
  - id: treasury_fiscaldata
    name: Treasury FiscalData API (debt, TGA, auctions)
    tier: 0
    kind: api
    url: https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v2/accounting/od/debt_to_penny?sort=-record_date&page[size]=10
    lang: en
    country: US
    topics: [fiscal, treasury, data]
    parent_org: us-treasury
    parser: fiscaldata_v1
    stratum: S-DATA
    interval_s: 21600
  - id: ecos_api
    name: 한국은행 ECOS API (기준금리·환율·금통위)
    tier: 0
    kind: api
    url: https://ecos.bok.or.kr/api/
    probe_url: https://ecos.bok.or.kr/api/
    auth_env: ECOS_API_KEY
    lang: ko
    country: KR
    topics: [bok, rates, fx, data]
    parent_org: bank-of-korea
    parser: ecos_v1
    stratum: S-DATA
    params:
      lookback_days: 400
      stats:   # ⚠️ 통계표·항목 코드는 ECOS 키 입력 후 첫 수집에서 검증
        - {stat: 722Y001, cycle: D, item: "0101000", name: base_rate}
        - {stat: 731Y001, cycle: D, item: "0000001", name: usdkrw}
  - id: bok_press
    name: 한국은행 보도자료
    tier: 0
    kind: rss
    url: https://www.bok.or.kr/portal/bbs/B0000501/news.rss?menuNo=200690
    lang: ko
    country: KR
    topics: [bok, rates, policy]
    parent_org: bank-of-korea
    parser: rss_default
    rate_limit_s: 5
    stratum: S-T0-STMT
    select_policy: title_regex
    select_regex: "(통화정책방향|기준금리|금융통화위원회|금통위|환율|외환|물가|경제전망|금융안정|국제수지|소비자동향|기업경기|총재)"
    fetch_body: true
  - id: dart_api
    name: DART Open API 공시 (삼성전자·SK하이닉스·어보브반도체 등)
    tier: 0
    kind: api
    url: https://opendart.fss.or.kr/api/list.json
    probe_url: https://opendart.fss.or.kr/api/list.json
    auth_env: DART_API_KEY
    lang: ko
    country: KR
    topics: [disclosure, semis, korea]
    parent_org: fss
    parser: dart_v1
    stratum: S-T0-STMT
    params:
      corp_names: [삼성전자, SK하이닉스, 어보브반도체]
  - id: sec_edgar_fts
    name: SEC EDGAR full-text search (8-K/10-Q — NVDA, AMD, AVGO, MU, TSM, ASML, MSFT, GOOGL, AMZN, META, ORCL)
    tier: 0
    kind: api
    url: https://efts.sec.gov/LATEST/search-index?q=%22data%20center%22&forms=8-K
    lang: en
    country: US
    topics: [disclosure, semis, hyperscalers]
    parent_org: sec
    parser: edgar_fts_v1
    rate_limit_s: 10
    stratum: S-T0-LONG
    enabled: false
    notes: SEC 는 User-Agent 에 연락처(이메일)를 요구한다. 개인정보 외부 전송은 사용자 허락 전 보류 (docs/QUESTIONS.md Q3) — 허락 전까지 비활성(수집하지 않음; probe 는 일반 UA 로 도달 여부만 확인)
  - id: whitehouse_news
    name: White House briefings & statements
    tier: 0
    kind: rss
    url: https://www.whitehouse.gov/news/feed/
    lang: en
    country: US
    topics: [politics, policy, tariffs]
    parent_org: white-house
    parser: rss_default
    rate_limit_s: 5
    stratum: S-T0-STMT
    select_policy: theme
    fetch_body: true
  - id: cbo_publications
    name: CBO publications
    tier: 0
    kind: rss
    url: https://www.cbo.gov/publications/all/rss.xml
    lang: en
    country: US
    topics: [fiscal, budget]
    parent_org: cbo
    parser: rss_default
    rate_limit_s: 10
    stratum: S-T0-LONG
    select_policy: theme
    fetch_body: true
  - id: fed_press_monetary
    name: Federal Reserve press releases — monetary policy only (FOMC statements, implementation notes)
    tier: 0
    kind: rss
    url: https://www.federalreserve.gov/feeds/press_monetary.xml
    lang: en
    country: US
    topics: [fed, rates, fomc]
    parent_org: federal-reserve
    parser: rss_default
    rate_limit_s: 5
    stratum: S-T0-STMT
    select_policy: all
    fetch_body: true
  - id: ecb_press
    name: ECB press releases
    tier: 0
    kind: rss
    url: https://www.ecb.europa.eu/rss/press.html
    lang: en
    country: EU
    topics: [ecb, rates, policy]
    parent_org: ecb
    parser: rss_default
    rate_limit_s: 5
    stratum: S-T0-STMT
    select_policy: title_regex
    select_regex: "(monetary policy|Governing Council|interest rate|inflation|deposit facility|decision|Lagarde|press conference)"
  # ---------------- T1 통신사·주요지 ----------------
  - id: yna_economy
    name: 연합뉴스 경제
    tier: 1
    kind: rss
    url: https://www.yna.co.kr/rss/economy.xml
    lang: ko
    country: KR
    topics: [macro, korea, markets]
    parent_org: yonhap
    parser: rss_default
    stratum: S-T1-KO
    interval_s: 7200   # 최다 발행 피드(~11건/시간, 120건 창 ≈ 11h) — 급증일 누락 방지 상한 2시간
    notes: 전재 원천 — 다른 매체의 연합 전재는 독립 출처로 세지 않는다 (§4.3)
  - id: hankyung_economy
    name: 한국경제 경제
    tier: 1
    kind: rss
    url: https://www.hankyung.com/feed/economy
    lang: ko
    country: KR
    topics: [macro, korea, markets]
    parent_org: hankyung
    parser: rss_default
    stratum: S-T1-KO
  - id: mk_economy
    name: 매일경제 경제
    tier: 1
    kind: rss
    url: https://www.mk.co.kr/rss/30100041/
    lang: ko
    country: KR
    topics: [macro, korea, markets]
    parent_org: maekyung
    parser: rss_default
    stratum: S-T1-KO
  - id: chosunbiz
    name: 조선비즈
    tier: 1
    kind: rss
    url: https://biz.chosun.com/arc/outboundfeeds/rss/?outputType=xml
    lang: ko
    country: KR
    topics: [macro, korea, semis]
    parent_org: chosun
    parser: rss_default
    stratum: S-T1-KO
  - id: gnews_reuters_macro
    name: Google News RSS — Reuters headlines (Fed/Treasury/semiconductor)
    tier: 1
    kind: rss
    url: https://news.google.com/rss/search?q=site:reuters.com+(Fed+OR+Treasury+OR+semiconductor+OR+tariff)&hl=en-US&gl=US&ceid=US:en
    lang: en
    country: US
    topics: [macro, fed, semis, tariffs]
    parent_org: reuters
    parser: gnews_rss_v1
    rate_limit_s: 10
    stratum: S-T1
    notes: 헤드라인·링크만. Reuters 본문은 수집하지 않는다 (§4.3 유료 벽 규칙 준용)
  - id: cnbc_economy
    name: CNBC Economy
    tier: 1
    kind: rss
    url: https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=20910258
    lang: en
    country: US
    topics: [macro, markets]
    parent_org: nbcuniversal
    parser: rss_default
    stratum: S-T1
  - id: marketwatch_top
    name: MarketWatch top stories
    tier: 1
    kind: rss
    url: https://feeds.content.dowjones.io/public/rss/mw_topstories
    lang: en
    country: US
    topics: [markets, macro]
    parent_org: dow-jones
    parser: rss_default
    stratum: S-T1
  - id: nikkei_asia
    name: Nikkei Asia (headlines)
    tier: 1
    kind: rss
    url: https://asia.nikkei.com/rss/feed/nar
    lang: en
    country: JP
    topics: [asia, semis, macro]
    parent_org: nikkei
    parser: rss_default
    paywall: true
    stratum: S-T1
    interval_s: 7200   # 피드에 발행시각 없음 → 창 측정 불가, 2시간 고정
  # ---------------- T2 전문·업계지 ----------------
  - id: trendforce_press
    name: TrendForce press center (DRAM/NAND 계약가)
    tier: 2
    kind: html
    url: https://www.trendforce.com/presscenter/news
    lang: en
    country: TW
    topics: [memory, dram, hbm, semis]
    parent_org: trendforce
    parser: trendforce_press_v1
    rate_limit_s: 10
    stratum: S-T2
    fetch_body: true
  - id: semianalysis
    name: SemiAnalysis (무료 공개분)
    tier: 2
    kind: rss
    url: https://semianalysis.com/feed/
    lang: en
    country: US
    topics: [semis, ai_capex, supply_chain]
    parent_org: semianalysis
    parser: rss_default
    paywall: true
    stratum: S-T2
  - id: tomshardware
    name: Tom's Hardware
    tier: 2
    kind: rss
    url: https://www.tomshardware.com/feeds/all
    lang: en
    country: US
    topics: [semis, gpu, memory]
    parent_org: future-plc
    parser: rss_default
    stratum: S-T2
  - id: calculated_risk
    name: Calculated Risk
    tier: 2
    kind: rss
    url: https://www.calculatedriskblog.com/feeds/posts/default
    lang: en
    country: US
    topics: [macro, housing, labor]
    parent_org: calculated-risk
    parser: rss_default
    stratum: S-T2
  - id: arstechnica
    name: Ars Technica
    tier: 2
    kind: rss
    url: https://feeds.arstechnica.com/arstechnica/index
    lang: en
    country: US
    topics: [tech, ai, semis]
    parent_org: conde-nast
    parser: rss_default
    stratum: S-T2
  # ---------------- T3 예측시장·데이터 ----------------
  - id: polymarket_gamma
    name: Polymarket Gamma API (Fed/election markets)
    tier: 3
    kind: api
    url: https://gamma-api.polymarket.com/markets?limit=200&closed=false&active=true&order=volume24hr&ascending=false
    lang: en
    topics: [prediction_market, fed, election]
    parent_org: polymarket
    parser: polymarket_v1
    stratum: S-DATA
    params:
      keywords: [fed, fomc, rate cut, rate hike, interest rate, inflation, cpi, recession, senate, house, midterm, balance of power, tariff, nvidia, bitcoin, iran, hormuz, oil, korea]
    notes: 가격은 사실, 결과는 아님 (§4.1)
  - id: kalshi_markets
    name: Kalshi trade API (markets)
    tier: 3
    kind: api
    url: https://api.elections.kalshi.com/trade-api/v2/markets
    lang: en
    topics: [prediction_market, fed, election]
    parent_org: kalshi
    parser: kalshi_v1
    stratum: S-DATA
    interval_s: 10800   # 시리즈 18개 × 요청 — 일별 가격만 쓰므로 3시간 (2026-11-03 주기 점검)
    params:   # /series?category=Economics 로 2026-11-02 확인한 시리즈 티커 (각각 한 요청, status=open)
      series_tickers: [KXFEDDECISION, KXFED, KXFEDHIKE, KXFEDCUT, KXRATEHIKE, KXFEDDISSENT, KXDOTPLOT, KXTERMINALRATE, KXFEDFUNDSYEAR, KXCPI, KXCPIYOY, KXCPICORE, KXPCECORE, KXPAYROLLS, KXU3, KXRECSSNBER, KXBALANCESHEET, KXCBDECISIONKOREA]
  - id: cme_fedwatch
    name: CME FedWatch (JS 렌더 — Playwright)
    tier: 3
    kind: playwright
    url: https://www.cmegroup.com/markets/interest-rates/cme-fedwatch-tool.html
    lang: en
    topics: [fed, rates, probability]
    parent_org: cme
    parser: fedwatch_v1
    rate_limit_s: 30
    stratum: S-DATA
    enabled: false
    notes: "2026-11-01 probe 403(봇 차단). Phase 1 에서 Playwright 설치 후 robots.txt 확인하고 활성화 여부 결정. 헤드리스·로그인 세션 없음"
  - id: cftc_cot
    name: CFTC Commitments of Traders (futures, weekly)
    tier: 3
    kind: api
    url: https://www.cftc.gov/dea/newcot/deafut.txt
    lang: en
    topics: [positioning, data]
    parent_org: cftc
    parser: cftc_cot_v1
    rate_limit_s: 10
    stratum: S-DATA
    interval_s: 21600
    params:
      markets:   # deafut.txt 의 Market_and_Exchange_Names 정확 일치 → 키 접미사
        "E-MINI S&P 500 - CHICAGO MERCANTILE EXCHANGE": ES
        "NASDAQ MINI - CHICAGO MERCANTILE EXCHANGE": NQ
        "UST 10Y NOTE - CHICAGO BOARD OF TRADE": TY
        "USD INDEX - ICE FUTURES U.S.": DX
        "BITCOIN - CHICAGO MERCANTILE EXCHANGE": BTC
        "GOLD - COMMODITY EXCHANGE INC.": GC
        "JAPANESE YEN - CHICAGO MERCANTILE EXCHANGE": JPY
        "EURO FX - CHICAGO MERCANTILE EXCHANGE": EUR
  - id: stooq_csv
    name: Stooq daily CSV (글로벌 지수 백업 — ^spx, ^sox 등)
    tier: 3
    kind: api
    url: https://stooq.com/q/d/l/?s=^spx&i=d
    lang: en
    topics: [prices, data]
    parent_org: stooq
    parser: stooq_csv_v1
    rate_limit_s: 5
    stratum: S-DATA
    enabled: false
    notes: "2026-11-02 캡처 시 CSV 대신 JavaScript 작업증명 봇 검사 페이지가 왔다. 우회하지 않는다 — 글로벌 지수는 naver_world_index(ADR-0005)로 대체, 키 입력 후 FRED 가 1차"
  # ---------------- 키 없는 시장 데이터 (ADR-0005; robots.txt 확인 2026-11-02, UA 위장 없음) ----------------
  - id: treasury_yield_curve
    name: 미 재무부 일별 par 수익률 곡선 (1M…30Y, 10Y-2Y·10Y-3M 스프레드 계산)
    tier: 0
    kind: api
    url: https://home.treasury.gov/resource-center/data-chart-center/interest-rates/pages/xml?data=daily_treasury_yield_curve
    probe_url: https://home.treasury.gov/resource-center/data-chart-center/interest-rates/pages/xml?data=daily_treasury_yield_curve&field_tdr_date_value_month=202610
    lang: en
    country: US
    topics: [rates, data]
    parent_org: us-treasury
    parser: treasury_yield_v1
    stratum: S-DATA
    interval_s: 21600
    notes: "월 단위 XML(전월+당월 2요청). robots: Allow /. 키 UST:<tenor>; FRED DGS2/DGS10 의 원천이라 키 없이 T0 수익률 확보"
  - id: ecb_exr
    name: ECB 기준환율 (USD·KRW·JPY·CNY per EUR, 14:15 CET) + USD 크로스 계산
    tier: 0
    kind: api
    url: https://data-api.ecb.europa.eu/service/data/EXR/D.USD+KRW+JPY+CNY.EUR.SP00.A?format=csvdata
    lang: en
    topics: [fx, dollar, data]
    parent_org: ecb
    parser: ecb_exr_v1
    stratum: S-DATA
    interval_s: 21600
    params:
      lookback_days: 120
    notes: "robots: /service/ 허용. ECB:KRW_EUR 등 원값 + ECB:USD_KRW_CROSS(=KRW_EUR/USD_EUR, 같은 고시 시각). 서울 종가 USD/KRW 는 ECOS 키 입력 후(Q17)"
  - id: naver_world_index
    name: Naver 세계 지수 일별 종가 (.SOX .INX .DJI .IXIC .VIX .DXY)
    tier: 3
    kind: api
    url: https://api.stock.naver.com/index/.SOX/price?pageSize=60&page=1
    lang: ko
    topics: [prices, semis, data]
    parent_org: naver
    parser: naver_world_index_v1
    stratum: S-DATA
    interval_s: 21600
    params:
      url_template: "https://api.stock.naver.com/index/{symbol}/price?pageSize={page_size}&page=1"
      symbols: [".SOX", ".INX", ".DJI", ".IXIC", ".VIX", ".DXY"]
      page_size: 60
    notes: "api.stock.naver.com 은 robots.txt 없음(404=허용). m.stock.naver.com·fchart·Yahoo·Binance 는 Disallow / 라 쓰지 않는다. 키 NAVER:.SOX (seed data_key 갱신)"
  - id: naver_domestic_index
    name: Naver 국내 지수 (KOSPI·KOSDAQ) — 장 마감(CLOSE) 값만 기록
    tier: 3
    kind: api
    url: https://polling.finance.naver.com/api/realtime/domestic/index/KOSPI,KOSDAQ
    lang: ko
    country: KR
    topics: [prices, korea, data]
    parent_org: naver
    parser: naver_domestic_index_v1
    stratum: S-DATA
    interval_s: 21600
